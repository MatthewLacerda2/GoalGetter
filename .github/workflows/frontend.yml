name: frontend

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - "frontend/**"
      # The API the frontend's contract test reads (#213): a backend change
      # that moves it is checked against the app in the same pull request.
      - "backend/openapi.json"
      - "Makefile"
      - ".github/workflows/frontend.yml"

jobs:
  frontend:
    name: lint · analyze · test
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The exact version is read from frontend/pubspec.yaml's
      # `environment.flutter`, never repeated here: two copies of a version
      # number are two things that can disagree. `channel: stable` only says
      # which channel that release came from; the version is what gets
      # installed. Tracking whatever `stable` resolves to on the day put CI on
      # 3.47.5 while this machine ran 3.44.1 (2026-09-25), and a run was lost
      # to two analyzer warnings that existed on only one of them (#119).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: frontend/pubspec.yaml
          cache: true
      # So every run states, in its own log, which version it analyzed with.
      # `make front-lint` and `make front-test` below also assert it: they
      # depend on `front-version`, which fails if what the runner installed is
      # not what the pin asks for (#147).
      - run: flutter --version
      # The committed pubspec.lock, exactly (#192), is installed by the
      # targets themselves: `front-lint` and `front-test` depend on
      # `front-deps` (`flutter pub get --enforce-lockfile`), so a local run and
      # this one install the same packages the same way (#227). It fails the
      # run when the lock is stale - a pubspec.yaml change pushed without the
      # `flutter pub get` that rewrites it - instead of resolving something
      # nobody reviewed, and checks each package's content hash.

      # The same targets `make frontend` runs locally: the gates are defined
      # once, in the Makefile, and CI calls them.
      #
      # `front-lint` is the house rules (`tool/frontend_linter.dart`) plus
      # `dart analyze`, which
      # (unlike `flutter analyze`) runs the riverpod_lint plugin (#169). A
      # warning fails it (#101); the infos are a separate, larger backlog and
      # still only report. The flags live in the Makefile, so there is one place
      # to change when they start blocking too.
      - name: Lint and analyze
        run: make front-lint

      # jscpd (#231): a block written twice instead of once in its hub. It runs
      # from the image the Makefile pins, on the Docker the runner has.
      - name: Duplicates
        run: make front-dup

      - name: Test
        run: make front-test

      # A golden that moved (#226) leaves the reference, the new image and
      # their diff in test/goldens/failures/: the only way to see from here
      # what CI drew.
      - name: Golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: frontend/test/goldens/failures/
          if-no-files-found: ignore

      # The committed `*.g.dart` providers match their sources (#225):
      # build_runner regenerates them and the step fails if anything changed.
      # Not in `make frontend` (1-2 minutes); the pre-push hook runs it when a
      # push touches a generator input.
      - name: Generated providers are fresh
        run: make front-codegen
