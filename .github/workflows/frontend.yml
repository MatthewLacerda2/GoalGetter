name: frontend

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - "frontend/**"
      - "Makefile"
      - ".github/workflows/frontend.yml"

jobs:
  frontend:
    name: lint · analyze · test
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: frontend

      # The same targets `make frontend` runs locally: the gates are defined
      # once, in the Makefile, and CI calls them.
      #
      # `front-lint` is the 400-line file limit plus `flutter analyze`. Its
      # strictness is staged - only errors fail the build for now, because the
      # repo carries a backlog (2026-09-21: 0 errors, 27 warnings, 533 infos) -
      # and the flags live in the Makefile, so #101 has one place to change when
      # warnings start blocking.
      - name: Lint and analyze
        run: make front-lint

      - name: Test
        run: make front-test
