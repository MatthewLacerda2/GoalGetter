name: backend

# PRs only, and only when the backend is touched. Drafts are skipped: a draft
# is unfinished work parked off one machine, not something to spend CI on.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "Makefile"
      - ".github/workflows/backend.yml"
      - "tools/test-db.sh"

jobs:
  backend:
    name: lint · dead code · build · pytest
    # `synchronize` also fires for pushes to a draft, so guard here too.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Matches backend/Dockerfile, so CI tests the interpreter we ship.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      # These gates run through the same `make` targets a developer runs. There
      # is no backend image on a runner, so PY and PY_OFFLINE are overridden to
      # the interpreter installed above; locally they default to
      # `docker run ... goalgetter-backend-planning-backend python`.
      #
      # House rules (file/endpoint/test length, repository pattern), then
      # ruff check + ruff format --check. First, because it is the cheapest.
      - name: Lint
        run: make back-lint PY=python

      # vulture: a function, class or method that no other module reaches. The
      # whitelist for what only FastAPI, SQLAlchemy or mock calls lives in
      # backend/tools/deadcode.py.
      - name: Dead code
        run: make back-deadcode PY=python

      # Import the app and generate the OpenAPI. Needs no database - it pins
      # placeholder settings before the import - and catches a broken import,
      # or a route whose response model no longer resolves, in about a second.
      - name: Build smoke
        run: make back-build PY_OFFLINE=python

      # mypy, strict: no `Any` in our signatures, no bare `dict` (#209). The
      # configuration and its reasons are [tool.mypy] in backend/pyproject.toml.
      - name: Types
        run: make back-types PY_OFFLINE=python

      # The two gates that need a database start their own, the way they do
      # locally (tools/test-db.sh, #205): a pgvector Postgres - the image
      # production runs - that exists for that one step and is removed after it.
      # TEST_DB_MODE=published is the one difference: pytest runs on the runner
      # here, not in a container that could join the database's network, so the
      # port is published on 127.0.0.1 instead. The script exports
      # TEST_DATABASE_URL and DATABASE_URL itself; the keys below exist only so
      # the settings load (the tests mock Gemini).
      #
      # The schema gate (#157): `alembic upgrade head` on the empty database,
      # then `alembic check` against the models.
      - name: Migrations
        env:
          TEST_DB_MODE: published
          GEMINI_API_KEY: test-key
          SECRET_KEY: test-secret
        run: make back-migrations PY_TESTDB=python

      # `make back-test PY_TESTDB=python` - the same target, and the same pytest
      # invocation, a developer runs, on a database of its own that the session
      # fixture migrates.
      - name: Pytest
        env:
          TEST_DB_MODE: published
          GEMINI_API_KEY: test-key
          SECRET_KEY: test-secret
        run: make back-test PY_TESTDB=python
