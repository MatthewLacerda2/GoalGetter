name: backend

# PRs only, and only when the backend is touched. Drafts are skipped: a draft
# is unfinished work parked off one machine, not something to spend CI on.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "Makefile"
      - ".github/workflows/backend.yml"

jobs:
  backend:
    name: lint · dead code · build · pytest
    # `synchronize` also fires for pushes to a draft, so guard here too.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    services:
      # pgvector, matching docker-compose. Tests connect on 5435 (see the
      # port mapping) because that is what the local test database uses.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goalgetter_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Matches backend/Dockerfile, so CI tests the interpreter we ship.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      # These gates run through the same `make` targets a developer runs. There
      # is no backend image on a runner, so PY and PY_OFFLINE are overridden to
      # the interpreter installed above; locally they default to
      # `docker run ... goalgetter-backend-planning-backend python`.
      #
      # House rules (file/endpoint/test length, repository pattern), then
      # ruff check + ruff format --check. First, because it is the cheapest.
      - name: Lint
        run: make back-lint PY=python

      # vulture: a function, class or method that no other module reaches. The
      # whitelist for what only FastAPI, SQLAlchemy or mock calls lives in
      # backend/tools/deadcode.py.
      - name: Dead code
        run: make back-deadcode PY=python

      # Import the app and generate the OpenAPI. Needs no database - it pins
      # placeholder settings before the import - and catches a broken import,
      # or a route whose response model no longer resolves, in about a second.
      - name: Build smoke
        run: make back-build PY_OFFLINE=python

      # The schema gate (#157): `alembic upgrade head` on an empty database,
      # then `alembic check` against the models. It resets TEST_DATABASE_URL's
      # schema first, which on a runner is the service container above - the
      # same database pytest then builds its tables in.
      - name: Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5435/goalgetter_test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5435/goalgetter_test
          GEMINI_API_KEY: test-key
          SECRET_KEY: test-secret
          GOOGLE_REDIRECT_URI: http://localhost/callback
        run: make back-migrations PY=python

      # `make back-test PY=python` - the same target, and the same pytest
      # invocation, a developer runs. The settings arrive as real environment
      # variables here, so the target's `env` prerequisite finds nothing to seed.
      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5435/goalgetter_test
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5435/goalgetter_test
          # Tests mock Gemini; these exist only so settings can load.
          GEMINI_API_KEY: test-key
          SECRET_KEY: test-secret
          GOOGLE_REDIRECT_URI: http://localhost/callback
        run: make back-test PY=python
