services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: goalgetter_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: goalgetter
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: pgvector/pgvector:pg16
    container_name: goalgetter_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD}
      POSTGRES_DB: goalgetter_test
    ports:
      - "127.0.0.1:5435:5432" # Bind to localhost only
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goalgetter_backend
    # No TZ here on purpose (#92): the container stays UTC and the app converts
    # to backend/core/clock.APP_TIMEZONE wherever a calendar day matters. A zone
    # set here would be invisible to pytest, CI and the seeder - see clock.py.
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/goalgetter
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_TEST_PASSWORD}@postgres_test:5432/goalgetter_test
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      SECRET_KEY: ${SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID}
      # Without it the resource job drops every YouTube link (it cannot verify them).
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 4
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

  # The nightly run (#89): one process, so 03:00 happens once. The API's four
  # uvicorn workers would each fire an in-process scheduler - see
  # backend/tools/nightly_run.py for why this is a service and not a cron entry.
  # It waits for the hour before it runs, so a restart never spends quota.
  nightly:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goalgetter_nightly
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/goalgetter
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_TEST_PASSWORD}@postgres_test:5432/goalgetter_test
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      SECRET_KEY: ${SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: python -m backend.tools.nightly_run
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BASE_URL: ${BASE_URL}
    container_name: goalgetter_frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:80/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: goalgetter_cloudflared
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  postgres_test_data:
