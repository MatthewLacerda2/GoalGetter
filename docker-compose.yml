services:
  # Postgres 18 mounts its volume at /var/lib/postgresql, one level up from
  # where 16 did: 18 keeps its cluster in /var/lib/postgresql/18/docker so a
  # later major can sit beside it for `pg_upgrade --link`, and it refuses to
  # start at all with a volume on the old /var/lib/postgresql/data path. New
  # volume names too, so the pg16 data is left untouched on disk rather than
  # half-read by a server that cannot open it.
  postgres:
    image: pgvector/pgvector:pg18
    container_name: goalgetter_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: goalgetter
    # Loopback only: the tunnel never reaches the database, and nothing on the
    # LAN should.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    restart: unless-stopped
    # Over TCP, and against the app's database. On a fresh volume the image's
    # first boot runs a temporary server on the unix socket only; a socket
    # `pg_isready` passes against it, and `migrate` then connects to a server
    # that is about to shut down. TCP answers only once the real one is up.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goalgetter -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: pgvector/pgvector:pg18
    container_name: goalgetter_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD}
      POSTGRES_DB: goalgetter_test
    ports:
      - "127.0.0.1:5435:5432" # Bind to localhost only
    volumes:
      - postgres18_test_data:/var/lib/postgresql
    restart: unless-stopped

  # The schema, applied once, before anything that reads it (#157). Nothing
  # creates tables on start any more: a container restart is the normal result
  # of a push, and the old startup path would have dropped every student.
  #
  # Its own service rather than the backend's lifespan, because `backend` and
  # `nightly` share this image and start together - two processes racing to
  # migrate the same database. As a service it runs once, and both of them wait
  # for it to *exit 0* (`service_completed_successfully`), so a failed migration
  # stops the deploy instead of being served on top of.
  #
  # No `restart:` here on purpose: this is a one-shot that must be allowed to
  # finish. `unless-stopped` would run it again forever.
  #
  # A migration only uses DATABASE_URL; the other three are what the settings
  # object requires before it will load at all (backend/core/config.py).
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goalgetter_migrate
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/goalgetter
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m alembic -c backend/alembic.ini upgrade head

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goalgetter_backend
    # No TZ here on purpose (#92): the container stays UTC and the app converts
    # to backend/core/clock.APP_TIMEZONE wherever a calendar day matters. A zone
    # set here would be invisible to pytest, CI and the seeder - see clock.py.
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/goalgetter
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_TEST_PASSWORD}@postgres_test:5432/goalgetter_test
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      SECRET_KEY: ${SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID}
      # Without it the resource job drops every YouTube link (it cannot verify them).
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
    # No host port, on purpose. nginx reaches the API at `backend:8000` over the
    # compose network, and Swagger is already at goalsgetter.org/api/v1/docs.
    # Publishing it cost more than it gave: 8000 is another project's here, and
    # 8001 is where the dev backend and `make preview` run - with the live
    # backend there, the preview's nginx would proxy /api to production.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 4
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

  # The night (#89, #96): one process, so each hour happens once. The API's four
  # uvicorn workers would each fire an in-process scheduler - see
  # backend/tools/nightly_run.py for why this is a service and not a cron entry.
  # It waits for the hour before it runs, so a restart never spends quota.
  # Two jobs share it, one at a time: the embedding backfill at midnight and the
  # per-student chain at 03:00. A second service for the backfill would have
  # been a second container and a second image for one cron tick a night, and
  # nothing would have stopped the two from calling Gemini at once.
  nightly:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goalgetter_nightly
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/goalgetter
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_TEST_PASSWORD}@postgres_test:5432/goalgetter_test
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      SECRET_KEY: ${SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    command: python -m backend.tools.nightly_run
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BASE_URL: ${BASE_URL}
    container_name: goalgetter_frontend
    # 8080 is another project's on this machine (see CLAUDE.md) - it was taken,
    # so the stack could not come up at all. The tunnel does not use this: its
    # ingress points at `http://frontend:80` over the compose network
    # (terraform/cloudflare_backup/main.tf), which is why moving the published
    # port cannot break the site. Loopback only, for looking at the real bundle
    # without going out to the internet and back.
    ports:
      - "127.0.0.1:8095:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:80/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  cloudflared:
    # A fixed release, not `latest`: a deploy should change what we changed.
    image: cloudflare/cloudflared:2026.9.3
    container_name: goalgetter_cloudflared
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres18_data:
  postgres18_test_data:
