server {
    listen 80;
    server_name goalsgetter.org www.goalsgetter.org;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers, on every response. nginx drops server-level
    # add_header in any location that sets its own, and every location here
    # does (Cache-Control) - so until this merge rule these were sent nowhere.
    add_header_inherit merge;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Every file is revalidated, none is cached blind. Flutter web names its
    # output without content hashes - flutter_bootstrap.js, canvaskit/, assets/
    # and the icons keep their names from one build to the next - so the old
    # "1y, immutable" on *.js/*.png kept a new deploy's bootstrap and icons
    # from ever reaching a browser or Cloudflare's edge (found 2026-09-26: the
    # edge still served the pre-#179 icon and bootstrap hours after a deploy).
    # `no-cache` still lets both keep a copy; they ask with its ETag first and
    # get a 304 when nothing changed, so an unchanged file costs one round trip.
    # No `json` here: a regex location outranks `location /api`, and would
    # send /api/v1/openapi.json to the static root.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        add_header Cache-Control "no-cache";
    }

    # Proxy API requests to backend service
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Increase timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Disable buffering for streaming responses
        proxy_buffering off;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
