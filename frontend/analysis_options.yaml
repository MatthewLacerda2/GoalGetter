include: package:very_good_analysis/analysis_options.yaml

analyzer:
  plugins:
    - custom_lint
  errors:
    # custom_lint (and riverpod_lint through it) is a legacy analyzer plugin
    # and Dart deprecated that system, so a newer analyzer warns about the two
    # lines above, and since #101 a warning fails `make front-lint`. The
    # analyzer we pin (frontend/pubspec.yaml) does not know that code yet and
    # warns about the ignore itself, so both are silenced. The pair outlived
    # the version drift that produced it (#121): it is now what keeps the pin
    # bumpable, since the first newer Flutter would otherwise redden the bump
    # PR. Drop it when custom_lint speaks the new protocol.
    unrecognized_error_code: ignore
    analysis_options_deprecated_plugins: ignore
  exclude:
    - "lib/**/*.g.dart"
    - "lib/**/*.freezed.dart"
    - "lib/l10n/generated/**"

linter:
  rules:
    public_member_api_docs: false
