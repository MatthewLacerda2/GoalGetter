include: package:very_good_analysis/analysis_options.yaml

# riverpod_lint 3 is an analysis_server_plugin: the analyzer loads it itself,
# so `flutter analyze` reports its lints with no custom_lint in between (#164).
plugins:
  riverpod_lint: ^3.1.9

analyzer:
  exclude:
    - "lib/**/*.g.dart"
    - "lib/**/*.freezed.dart"
    - "lib/l10n/generated/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    public_member_api_docs: false
