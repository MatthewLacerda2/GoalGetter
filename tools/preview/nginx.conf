# The tailnet preview (make preview): the release web build and the API on one
# origin, like production's frontend/nginx.conf, but for a container on the
# host network. It listens on loopback and on this machine's Tailscale address
# only (make preview fills __TAILNET_IP__ in from `tailscale ip -4`), so nothing
# outside the tailnet can reach it - never on 0.0.0.0, never through funnel.
server {
    listen 127.0.0.1:8093;
    listen __TAILNET_IP__:8093;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm;

    # Never serve a stale entrypoint after a rebuild.
    location ~* (main\.dart\.js|flutter_service_worker\.js|flutter_bootstrap\.js|index\.html)$ {
        add_header Cache-Control "no-store";
    }

    location /api {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # SPA: go_router uses path URLs, so a deep link must fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
